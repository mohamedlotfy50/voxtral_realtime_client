[project]
name = "voxtral-realtime-client"
version = "0.1.0"
description = "OOP realtime transcription client for the patched Voxtral vLLM server."
requires-python = ">=3.10"
dependencies = [
    "websockets>=12",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "lingua-language-detector>=1.3",
    "aiohttp>=3.9",
    "sounddevice>=0.4",
]

[tool.setuptools]
packages = ["voxtral_client", "voxtral_client.audio", "voxtral_client.model",
            "voxtral_client.nlp", "voxtral_client.net", "voxtral_client.presentation"]
py-modules = ["main"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
